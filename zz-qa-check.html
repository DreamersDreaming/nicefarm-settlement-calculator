<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>QA mobile overflow check</title>
<style>
 body{margin:0;background:#e9ece9;font:12px/1.4 -apple-system,sans-serif}
 .row{display:flex;gap:6px;padding:6px;align-items:flex-start}
 .col{border:2px solid #d00;background:#fff}
 .col b{display:block;padding:2px 4px;background:#d00;color:#fff;font-size:11px}
 iframe{display:block;border:0;background:#fff}
 pre{background:#fff;padding:8px;white-space:pre-wrap;font-size:11px;margin:6px}
</style></head>
<body>
<div class="row" id="row"></div>
<pre id="out">measuring…</pre>
<script>
const widths = [320, 360, 375, 390];
const frames = [];
widths.forEach(w => {
  const col = document.createElement('div');
  col.className = 'col';
  const lab = document.createElement('b');
  lab.textContent = w + 'px';
  const f = document.createElement('iframe');
  f.width = w; f.height = 980;
  f.src = '../index.html?qa=' + w;
  col.appendChild(lab); col.appendChild(f);
  document.getElementById('row').appendChild(col);
  frames.push({w, f});
});

function measure() {
  const res = [];
  frames.forEach(({w, f}) => {
    try {
      const d = f.contentDocument, de = d.documentElement;
      const bad = [...d.querySelectorAll('body *')].map(e => {
        const r = e.getBoundingClientRect();
        return {t: e.tagName, c: String(e.className || '').slice(0, 30), right: Math.round(r.right), left: Math.round(r.left)};
      }).filter(o => o.right > de.clientWidth + 0.5 || o.left < -0.5);
      res.push({width: w, scrollWidth: de.scrollWidth, clientWidth: de.clientWidth, bodyScroll: d.body.scrollWidth, overflow: bad.length, offenders: bad.slice(0, 10)});
    } catch (e) { res.push({width: w, error: String(e)}); }
  });
  document.getElementById('out').textContent = JSON.stringify(res, null, 1);
}
let n = 0;
frames.forEach(({f}) => f.addEventListener('load', () => { if (++n === widths.length) setTimeout(measure, 600); }));
setTimeout(measure, 2500);
</script>
</body></html>
