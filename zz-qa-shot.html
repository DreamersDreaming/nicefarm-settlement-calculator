<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>QA shot</title>
<style>
 body{margin:0;background:#cfd6d1;font:12px -apple-system,sans-serif}
 .stage{width:290px;margin:4px;border:1px solid #888;background:#fff;overflow:hidden}
 .stage iframe{width:375px;height:1400px;border:0;display:block;transform:scale(0.7733);transform-origin:top left}
 #h{font-size:11px;padding:2px 4px;background:#333;color:#fff}
</style></head><body>
<div id="h">375px mobile view (scaled 77%)</div>
<div class="stage" style="height:1083px"><iframe id="fr" src="index.html?shot=1"></iframe></div>
<script>
document.getElementById('fr').addEventListener('load',()=>{
  try{const d=document.getElementById('fr').contentDocument;document.getElementById('h').textContent='375px mobile · page height '+d.documentElement.scrollHeight+'px · scrollWidth '+d.documentElement.scrollWidth+' / clientWidth '+d.documentElement.clientWidth;}catch(e){}
});
</script>
</body></html>
