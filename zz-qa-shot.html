<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>QA shot</title>
<style>
 body{margin:0;background:#cfd6d1;font:12px -apple-system,sans-serif;display:flex;gap:10px;align-items:flex-start;padding:6px}
 .stage{width:290px;border:1px solid #888;background:#fff;overflow:hidden}
 .stage.s1 iframe{width:375px;height:1460px;border:0;display:block;transform:scale(0.7733);transform-origin:top left}
 .stage.s2{width:377px}
 .stage.s2 iframe{width:375px;height:960px;border:0;display:block}
 .lab{font-size:11px;padding:2px 4px;background:#222;color:#fff}
</style></head><body>
<div class="stage s1"><div class="lab" id="h1">375px full page</div><iframe id="fr" src="index.html?shot=1"></iframe></div>
<div class="stage s2"><div class="lab" id="h2">375px top (100%)</div><iframe id="fr2" src="index.html?shot=2"></iframe></div>
<script>
function info(id, lab){
  try{
    const d=document.getElementById(id).contentDocument;
    return 'h '+d.documentElement.scrollHeight+' · sw '+d.documentElement.scrollWidth+' / cw '+d.documentElement.clientWidth;
  }catch(e){return String(e);}
}
document.addEventListener('load', ()=>{}, true);
setTimeout(()=>{
  document.getElementById('h1').textContent='375px full page · '+info('fr');
  document.getElementById('h2').textContent='375px top 100% · '+info('fr2');
}, 1800);
</script>
</body></html>
