<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>QA single</title>
<style>html,body{margin:0;padding:0;background:#fff}iframe{border:0;display:block}</style>
</head>
<body>
<iframe id="f" src="/nicefarm-settlement-calculator/?v=4" width="375" height="2000"></iframe>
<script>
var w = Number(new URLSearchParams(location.search).get('w')) || 375;
var f = document.getElementById('f');
f.width = w;
function fit(){
  try{
    var d = f.contentDocument;
    f.height = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
    document.title = 'QA ' + w + ' h=' + f.height + ' sw=' + d.documentElement.scrollWidth + '/cw=' + d.documentElement.clientWidth;
  }catch(e){ document.title = 'ERR ' + e.message; }
}
f.addEventListener('load', function(){ setTimeout(fit, 500); setTimeout(fit, 1500); });
</script>
</body>
</html>
