<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA · 320/360/375/390</title>
<style>
  body{margin:0;background:#1b1b1b;font-family:-apple-system,sans-serif;color:#fff}
  .row{padding:14px 14px 26px;border-bottom:2px solid #444}
  .lbl{font:800 15px/1.4 -apple-system,sans-serif;color:#ffd75e;margin-bottom:8px}
  .stat{font:600 12px/1.5 -apple-system,sans-serif;color:#9fe6b0;margin-bottom:8px;white-space:pre-wrap}
  .stat.bad{color:#ff8d8d}
  iframe{border:0;background:#fff;display:block;box-shadow:0 0 0 1px #555}
</style>
</head>
<body>
<div class="row" data-w="320"><div class="lbl">320px</div><div class="stat" id="s320">…</div><iframe id="f320" width="320" height="1800" src="/nicefarm-settlement-calculator/?v=3"></iframe></div>
<div class="row" data-w="360"><div class="lbl">360px</div><div class="stat" id="s360">…</div><iframe id="f360" width="360" height="1800" src="/nicefarm-settlement-calculator/?v=3"></iframe></div>
<div class="row" data-w="375"><div class="lbl">375px</div><div class="stat" id="s375">…</div><iframe id="f375" width="375" height="1800" src="/nicefarm-settlement-calculator/?v=3"></iframe></div>
<div class="row" data-w="390"><div class="lbl">390px</div><div class="stat" id="s390">…</div><iframe id="f390" width="390" height="1800" src="/nicefarm-settlement-calculator/?v=3"></iframe></div>
<script>
var WIDTHS=[320,360,375,390];
function scan(){
  WIDTHS.forEach(function(w){
    var f=document.getElementById('f'+w), s=document.getElementById('s'+w);
    try{
      var d=f.contentDocument, el=d.documentElement, vw=d.documentElement.clientWidth;
      var bad=[];
      d.querySelectorAll('*').forEach(function(n){
        var r=n.getBoundingClientRect();
        if(r.width===0&&r.height===0) return;
        if(r.right>vw+0.6||r.left<-0.6){
          bad.push(n.tagName+'.'+String(n.className).slice(0,26)+' ['+r.left.toFixed(0)+'→'+r.right.toFixed(0)+']');
        }
      });
      var notBB=0;
      d.querySelectorAll('*').forEach(function(n){ if(getComputedStyle(n).boxSizing!=='border-box') notBB++; });
      var h=Math.max(d.body.scrollHeight, el.scrollHeight);
      f.height=h;
      s.className='stat'+(bad.length||el.scrollWidth>vw?' bad':'');
      s.textContent='vw='+vw+' scrollWidth='+el.scrollWidth+' body='+d.body.scrollWidth+
        ' overflow='+(el.scrollWidth>vw)+' offending='+bad.length+' notBorderBox='+notBB+
        '\nheight='+h+(bad.length?'\n'+bad.slice(0,6).join('\n'):'');
    }catch(e){ s.textContent='ERR '+e.message; s.className='stat bad'; }
  });
}
window.addEventListener('load',function(){ setTimeout(scan,600); setTimeout(scan,1400); setTimeout(scan,2400); });
window.addEventListener('resize',function(){ setTimeout(scan,200); });
</script>
</body>
</html>
